server:
  port: 8080

spring:
  application:
    name: assistant
logging:
  level:
    com.cdq.assistant.chat.ChatController: DEBUG

langchain4j:
  ollama:
    streaming-chat-model:
      base-url: http://localhost:11434
      model-name: qwen3:4b
      timeout: PT360S
      think: true
      return-thinking: true

assistant:
  countries-mcp:
    url: http://localhost:8081/mcp
  weather:
    command: node
    directory: ${WEATHER_MCP_DIR:}
    script: mcp-weather/weather-mcp.mjs
    api-key: ${WEATHER_API_KEY:}
    api-url: https://api.weatherapi.com/v1/current.json
  rag:
    jdbc-host: ${RAG_JDBC_HOST:localhost}
    jdbc-port: ${RAG_JDBC_PORT:5432}
    jdbc-database: ${RAG_JDBC_DATABASE:rag}
    jdbc-user: ${RAG_JDBC_USER:rag}
    jdbc-password: ${RAG_JDBC_PASSWORD:rag}
    ollama-base-url: ${RAG_OLLAMA_BASE_URL:http://localhost:11434}
    embedding-model: ${RAG_EMBEDDING_MODEL:nomic-embed-text}
    embedding-dimension: ${RAG_EMBEDDING_DIMENSION:768}
    max-results: 4
    min-score: 0.8
